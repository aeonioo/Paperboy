name: Daily Newspaper Mailer

on:
  workflow_dispatch: {}
  schedule:
    # Times are UTC. IST = UTC + 5:30.
    # Check every 30 minutes from 08:00 IST to 14:30 IST.
    - cron: "37 2 * * *"   # ~08:07 IST
    - cron: "7 3 * * *"    # ~08:37 IST
    - cron: "37 3 * * *"   # ~09:07 IST
    - cron: "7 4 * * *"
    - cron: "37 4 * * *"
    - cron: "7 5 * * *"
    - cron: "37 5 * * *"
    - cron: "7 6 * * *"
    - cron: "37 6 * * *"
    - cron: "7 7 * * *"
    - cron: "37 7 * * *"
    - cron: "7 8 * * *"
    - cron: "37 8 * * *"
    - cron: "7 9 * * *"

permissions:
  contents: write

concurrency:
  group: newspaper-mailer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mailer
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL: marathinewspaperwali
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FATHER_EMAIL: ${{ secrets.FATHER_EMAIL }}
        run: python script.py

      - name: Commit updated state
        run: |
          git config user.name "newspaper-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state [skip ci]"
          git push
